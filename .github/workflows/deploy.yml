name: Deploy docs

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    # A workflow_run workflow receives elevated permissions, so only deploy a
    # successful CI run that originated in this repository.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Deploy the exact commit that passed CI; manual runs use the
          # default checkout ref instead.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/configure-pages@v6
      - run: pnpm install --frozen-lockfile
      # `nx run docs:build` builds pixelshift-core and pixelshift-web-core
      # first, since Nx infers the dependency edge from the workspace:*
      # references in apps/docs/package.json. No Nx cache is restored in this
      # workflow on purpose: the cache key doesn't account for
      # NEXT_PUBLIC_SITE_URL, so a local/CI docs build could get reused here
      # with the wrong origin baked into metadata.
      - name: Build the static site
        run: pnpm exec nx run docs:build
        env:
          NEXT_PUBLIC_SITE_URL: https://pixelshift.mohammed.win
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
